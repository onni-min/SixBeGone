<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SixBeGone</title>
    <link rel="stylesheet" href="../../ui/style.css" />
  </head>
  <body class="popup">
    <header>
      <h1>SixBeGone</h1>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span>On</span>
      </label>
    </header>
    <p id="status" class="muted"></p>
    <p><strong id="count">0</strong> items removed so far</p>
    <label class="check">
      <input type="checkbox" id="strict" />
      <span><strong>Strict mode</strong><br /><span class="muted">Hide all GTA games and everything Rockstar, not just GTA 6</span></span>
    </label>
    <div class="row">
      <button type="button" id="pause">Pause 10 min</button>
      <button type="button" id="options">Settings</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
